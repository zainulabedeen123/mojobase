name: Publish Mojobase image

# Builds the Mojobase app image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/mojobase:latest      (every push to main)
#   ghcr.io/<owner>/mojobase:<short-sha> (every push to main)
#   ghcr.io/<owner>/mojobase:vX.Y.Z      (version tags)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: mojobase-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mojobase
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Mojobase
            org.opencontainers.image.description=Self-hosted backend platform (built on InsForge)
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
