name: Publish Mojobase images

# Builds and publishes every image the Mojobase platform runs:
#   ghcr.io/<owner>/mojobase            backend + project dashboard (one per project)
#   ghcr.io/<owner>/mojobase-postgres   Postgres with Mojobase extensions and init files
#   ghcr.io/<owner>/mojobase-deno       edge-functions runtime
#   ghcr.io/<owner>/mojobase-console    console at mojobase.dev (sign up, create projects)
# Tags: latest (main), <short-sha> (every push), vX.Y.Z (version tags).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: mojobase-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mojobase
            context: .
            file: Dockerfile
            target: runner
            description: Mojobase backend and project dashboard (built on InsForge)
          - image: mojobase-postgres
            context: .
            file: deploy/Dockerfile.postgres
            target: ''
            description: Postgres for Mojobase projects
          - image: mojobase-deno
            context: .
            file: deploy/Dockerfile.deno
            target: ''
            description: Edge-functions runtime for Mojobase projects
          - image: mojobase-console
            context: console
            file: console/Dockerfile
            target: ''
            description: Mojobase console - sign up and create projects
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
