name: Publish npm packages

# Publishes @mojobase/sdk, @mojobase/mcp and @mojobase/install from npm/*.
# A package is published only when its package.json version is not on npm yet,
# so re-running is safe. Needs the repository secret NPM_TOKEN (an npm token
# with read/write access to the "mojobase" organization).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'npm/*/package.json'

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: [sdk, mcp, install]
    defaults:
      run:
        working-directory: npm/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.check.outputs.publish == 'true'
        run: npm ci || npm install --no-audit --no-fund

      - name: Test
        if: steps.check.outputs.publish == 'true' && matrix.package != 'install'
        run: npx vitest run

      - name: Build
        if: steps.check.outputs.publish == 'true' && matrix.package != 'install'
        run: npm run build

      - name: Publish ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
